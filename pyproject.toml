[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gym"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "devtools>=0.12.2",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1.0.0",
    "railtracks[retrieval, visual]>=1.4.0",
]

[project.optional-dependencies]
# Legacy retrieval backend (RETRIEVAL_BACKEND=railengine).
# Install with: uv sync --extra railengine
railengine = [
    "rail-engine>=0.1.6, <0.1.8",
    "rail-engine-ingest>=0.1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gym_pt"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
# Dev twin of the [project.optional-dependencies] railengine extra (keep the
# pins in sync). As a default group it survives plain `uv sync` / `uv run`,
# which would otherwise prune the extra and silently skip railengine smoke
# tests. Production installs (`pip install gym`) still exclude it.
railengine-dev = [
    "rail-engine>=0.1.6, <0.1.8",
    "rail-engine-ingest>=0.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` runs only offline, deterministic tests. Smoke tests hit live
# LLM APIs / retrieval backends and cost money: opt in with `pytest -m smoke`.
addopts = "-m 'not smoke'"
markers = [
    "smoke: live end-to-end checks against real APIs (deselected by default)",
]
asyncio_mode = "auto"

[tool.uv]
default-groups = ["dev", "railengine-dev"]
